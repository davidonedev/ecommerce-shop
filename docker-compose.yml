# Uso: copie .env.example para .env e rode:
#   docker compose up -d                       só Postgres e Redis (API e site rodam na sua máquina)
#   docker compose --profile full up -d --build   tudo em containers (Postgres, Redis, API e site)
services:
  postgres:
    image: postgres:16
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ecommerce} -d ${POSTGRES_DB:-ecommerce}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Aplicação completa em containers (perfil "full") ---
  # Uso: docker compose --profile full up -d --build
  # Sem o perfil, sobem só Postgres e Redis e você roda API e site direto na máquina.
  backend:
    profiles: [full]
    build: ./backend
    container_name: ecommerce-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Dentro da rede do Compose os serviços se enxergam pelo nome e usam as portas internas.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ecommerce}
      DB_USER: ${POSTGRES_USER:-ecommerce}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET (32+ bytes) no arquivo .env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - '${BACKEND_PORT:-8080}:8080'
    healthcheck:
      # A imagem não tem curl; testa o endpoint de saúde com o bash (o sh padrão não suporta /dev/tcp).
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /actuator/health HTTP/1.0\r\n\r\n" >&3 && grep -q "\"status\":\"UP\"" <&3'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    profiles: [full]
    build:
      context: ./frontend
      args:
        # Gravado no build: o Next encaminha /api para a API pelo nome do serviço.
        API_PROXY_TARGET: http://backend:8080
    container_name: ecommerce-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-3000}:3000'

volumes:
  postgres-data:
  redis-data:
