spring:
  application:
    name: shop
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/ecommerce}
    username: ${DB_USER:ecommerce}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    # Gere um segredo forte (>= 32 bytes) e informe via variável de ambiente.
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  uploads:
    # Pasta das imagens enviadas pelo painel (em containers, um volume aponta para cá).
    dir: ${UPLOADS_DIR:./uploads}
  bootstrap-admin:
    # Primeiro administrador: criado só se a conta não existir (senha com 8+ caracteres).
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true

springdoc:
  swagger-ui:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
